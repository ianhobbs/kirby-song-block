name: Song
icon: file-audio
label: "{{ title }}"
tabs:
  main:
    label: Main
    fields:
      poster:
        type: files
        query: page.images.template('poster')
        uploads: poster
        multiple: false
        width: 1/2
      source:
        type: files
        query: page.audio.template('audio')
        uploads: audio
        multiple: false
        width: 1/2
      title:
        type: writer
        inline: true
        marks: false
        placeholder: Title
      subtitle:
        type: writer
        inline: true
        marks: false
        placeholder: Subtitle
      description:
        type: writer
        icon: text
        inline: true
        placeholder: Description
        marks:
          - bold
          - italic
      bgcolor:
        type: color
        label: Background color
        width: 1/2
      textcolor:
        type: color
        label: Text color
        width: 1/2
  settings:
    label: Settings
    fields:
      layout:
        type: toggles
        label: Poster layout
        options:
          side: Beside text
          background: Background
        default: side
        help: Background stretches the poster behind the player.
      controls:
        type: toggle
        text: Show controls?
        width: 1/2
        default: true
      autoplay:
        type: toggle
        text: autoplay
        width: 1/2
        default: false
        help: Most browsers block audio autoplay until the visitor has interacted with the page.
